<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --card: #1f1f25;
    --border: #2e2e38;
    --accent: #c8f060;
    --accent2: #60d0f0;
    --text: #e8e8f0;
    --muted: #7070a0;
    --danger: #f06070;
    --mono: 'DM Mono', monospace;
    --serif: 'Fraunces', serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    background-image:
      radial-gradient(ellipse 60% 50% at 20% 10%, #c8f06015 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 90%, #60d0f010 0%, transparent 60%);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }
  h1 em { font-style: italic; color: var(--accent); }

  .header {
    max-width: 720px;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .rate-badge {
    font-size: .72rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .3rem .6rem;
    white-space: nowrap;
  }
  .rate-badge span { color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.8rem;
    max-width: 720px;
    margin: 0 auto 1.5rem;
  }

  .converter-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1rem;
    align-items: end;
    margin-bottom: 1.5rem;
  }

  label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: .5rem; letter-spacing: .08em; text-transform: uppercase; }

  input[type=number], select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 1.05rem;
    padding: .75rem 1rem;
    outline: none;
    transition: border-color .2s;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number]:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--card); }

  .swap-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 42px; height: 42px;
    color: var(--accent);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .3s;
    flex-shrink: 0;
    margin-bottom: 0;
    align-self: flex-end;
  }
  .swap-btn:hover { background: var(--border); transform: rotate(180deg); }

  .result-block {
    background: var(--surface);
    border-radius: 10px;
    padding: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    min-height: 84px;
    border: 1px solid transparent;
    transition: border-color .3s;
  }
  .result-block.has-result { border-color: var(--accent)30; }

  .result-main { font-family: var(--serif); font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 700; color: var(--accent); }
  .result-rate { font-size: .72rem; color: var(--muted); margin-top: .3rem; }
  .result-reverse { font-size: .8rem; color: var(--accent2); text-align: right; }

  .tabs { display: flex; gap: .5rem; margin-bottom: 1.2rem; }
  .tab {
    font-family: var(--mono); font-size: .72rem; letter-spacing: .08em;
    text-transform: uppercase; padding: .4rem 1rem; border-radius: 6px;
    cursor: pointer; background: transparent; border: 1px solid var(--border);
    color: var(--muted); transition: all .2s;
  }
  .tab.active { background: var(--accent); color: #0e0e10; border-color: var(--accent); font-weight: 500; }
  .tab:hover:not(.active) { border-color: var(--muted); color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* History */
  .history-list { display: flex; flex-direction: column; gap: .6rem; max-height: 320px; overflow-y: auto; }
  .history-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: .7rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  }
  .h-pair { font-size: .78rem; color: var(--muted); }
  .h-amount { font-family: var(--serif); font-size: 1rem; color: var(--text); }
  .h-result { font-family: var(--serif); font-size: 1rem; color: var(--accent); text-align: right; }
  .h-time { font-size: .65rem; color: var(--muted); }
  .empty-msg { color: var(--muted); font-size: .8rem; text-align: center; padding: 2rem 0; }

  /* Rates table */
  .rates-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: .5rem; max-height: 320px; overflow-y: auto;
  }
  .rate-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: .6rem .9rem; cursor: pointer; transition: border-color .15s;
  }
  .rate-item:hover { border-color: var(--accent2); }
  .rate-code { font-size: .8rem; color: var(--accent2); font-weight: 500; }
  .rate-val { font-size: .75rem; color: var(--muted); margin-top: .15rem; }
  .rate-name { font-size: .65rem; color: #50507a; margin-top: .1rem; }

  /* Search */
  .search-bar {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: .85rem;
    padding: .6rem 1rem; outline: none; margin-bottom: 1rem; transition: border-color .2s;
  }
  .search-bar:focus { border-color: var(--accent2); }

  /* Favorites */
  .fav-list { display: flex; flex-direction: column; gap: .5rem; }
  .fav-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: .7rem 1rem; display: flex; justify-content: space-between; align-items: center;
  }
  .fav-pair { color: var(--accent); font-size: .85rem; }
  .fav-rate { color: var(--muted); font-size: .8rem; }
  .fav-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: .9rem; padding: .2rem; opacity: .6; }
  .fav-del:hover { opacity: 1; }

  /* Fav star */
  .fav-btn {
    background: none; border: none; cursor: pointer; font-size: 1.1rem;
    color: var(--muted); padding: .3rem; transition: color .2s;
  }
  .fav-btn.starred { color: #f0c840; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 520px) {
    .converter-row { grid-template-columns: 1fr; }
    .swap-btn { transform: rotate(90deg); width: 36px; height: 36px; justify-self: center; }
    .swap-btn:hover { transform: rotate(270deg); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Currency<br><em>Converter</em></h1>
  <div class="rate-badge">Rates source: <span id="rateSource">built-in</span> · <span id="rateTime"></span></div>
</div>

<div class="card">
  <!-- Converter -->
  <div class="converter-row">
    <div>
      <label>Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any">
    </div>
    <button class="swap-btn" onclick="swapCurrencies()" title="Swap">⇄</button>
    <div>
      <label>Result</label>
      <input type="number" id="resultInput" readonly placeholder="—" style="cursor:default; color: var(--accent)">
    </div>
  </div>

  <div class="converter-row" style="margin-bottom:1.2rem">
    <div>
      <label>From</label>
      <select id="fromCur"></select>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:center; padding-bottom:.1rem">
      <button class="fav-btn" id="favBtn" onclick="toggleFav()" title="Favorite this pair">☆</button>
    </div>
    <div>
      <label>To</label>
      <select id="toCur"></select>
    </div>
  </div>

  <div class="result-block" id="resultBlock">
    <div>
      <div class="result-main" id="resultMain">Enter an amount above</div>
      <div class="result-rate" id="resultRate"></div>
    </div>
    <div class="result-reverse" id="resultReverse"></div>
  </div>
</div>

<!-- Tabs -->
<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="showPanel('panelRates', this)">All Rates</button>
    <button class="tab" onclick="showPanel('panelFavs', this)">★ Favorites</button>
    <button class="tab" onclick="showPanel('panelHistory', this)">History</button>
  </div>

  <!-- Rates -->
  <div class="panel active" id="panelRates">
    <input class="search-bar" id="rateSearch" placeholder="Search currency…" oninput="renderRates()">
    <div class="rates-grid" id="ratesGrid"></div>
  </div>

  <!-- Favorites -->
  <div class="panel" id="panelFavs">
    <div class="fav-list" id="favList"></div>
  </div>

  <!-- History -->
  <div class="panel" id="panelHistory">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
      <span style="font-size:.7rem;color:var(--muted)">Last 30 conversions</span>
      <button onclick="clearHistory()" style="font-size:.7rem;color:var(--danger);background:none;border:none;cursor:pointer">Clear all</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const FALLBACK = {
  USD:1,EUR:.92,GBP:.79,JPY:149.5,CAD:1.36,AUD:1.53,CHF:.88,CNY:7.24,
  INR:83.1,MXN:17.15,BRL:4.97,KRW:1325,SGD:1.34,HKD:7.82,NOK:10.55,
  SEK:10.42,DKK:6.89,NZD:1.63,ZAR:18.63,AED:3.67,PLN:3.97,THB:35.1,
  TRY:30.5,SAR:3.75,QAR:3.64,MYR:4.72,PHP:56.1,IDR:15600,VND:24350,CZK:22.6
};
const NAMES = {
  USD:"US Dollar",EUR:"Euro",GBP:"British Pound",JPY:"Japanese Yen",
  CAD:"Canadian Dollar",AUD:"Australian Dollar",CHF:"Swiss Franc",
  CNY:"Chinese Yuan",INR:"Indian Rupee",MXN:"Mexican Peso",
  BRL:"Brazilian Real",KRW:"South Korean Won",SGD:"Singapore Dollar",
  HKD:"Hong Kong Dollar",NOK:"Norwegian Krone",SEK:"Swedish Krona",
  DKK:"Danish Krone",NZD:"New Zealand Dollar",ZAR:"South African Rand",
  AED:"UAE Dirham",PLN:"Polish Złoty",THB:"Thai Baht",TRY:"Turkish Lira",
  SAR:"Saudi Riyal",QAR:"Qatari Riyal",MYR:"Malaysian Ringgit",
  PHP:"Philippine Peso",IDR:"Indonesian Rupiah",VND:"Vietnamese Đồng",CZK:"Czech Koruna"
};

let rates = {...FALLBACK};
let history = JSON.parse(localStorage.getItem('cc_history') || '[]');
let favorites = JSON.parse(localStorage.getItem('cc_favs') || '[]');

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  populateSelects();
  document.getElementById('fromCur').value = 'USD';
  document.getElementById('toCur').value = 'EUR';
  fetchRates();
  addListeners();
  renderRates();
  renderHistory();
  renderFavs();
  updateFavBtn();
  convert();
}

function populateSelects() {
  const sorted = Object.keys(rates).sort();
  ['fromCur','toCur'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = sorted.map(c =>
      `<option value="${c}">${c} — ${NAMES[c]||c}</option>`
    ).join('');
  });
}

async function fetchRates() {
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD');
    const d = await r.json();
    if (d.result === 'success') {
      rates = d.rates;
      document.getElementById('rateSource').textContent = 'live';
      document.getElementById('rateTime').textContent = new Date().toLocaleTimeString();
      populateSelects();
      document.getElementById('fromCur').value = 'USD';
      document.getElementById('toCur').value = 'EUR';
      renderRates();
      convert();
    }
  } catch(e) {
    document.getElementById('rateSource').textContent = 'offline (built-in)';
    document.getElementById('rateTime').textContent = '2024 snapshot';
  }
}

function addListeners() {
  ['amount','fromCur','toCur'].forEach(id =>
    document.getElementById(id).addEventListener('input', () => { convert(); updateFavBtn(); })
  );
}

// ── Conversion ────────────────────────────────────────────────────────────────
function convert() {
  const amount = parseFloat(document.getElementById('amount').value);
  const from = document.getElementById('fromCur').value;
  const to = document.getElementById('toCur').value;
  const block = document.getElementById('resultBlock');

  if (!amount || isNaN(amount) || amount <= 0) {
    document.getElementById('resultMain').textContent = 'Enter an amount above';
    document.getElementById('resultRate').textContent = '';
    document.getElementById('resultReverse').textContent = '';
    document.getElementById('resultInput').value = '';
    block.classList.remove('has-result');
    return;
  }

  const inUSD = amount / rates[from];
  const result = inUSD * rates[to];
  const rate = rates[to] / rates[from];
  const reverseRate = rates[from] / rates[to];

  document.getElementById('resultInput').value = result.toFixed(4);
  document.getElementById('resultMain').textContent =
    `${fmt(result)} ${to}`;
  document.getElementById('resultRate').textContent =
    `1 ${from} = ${rate.toFixed(6)} ${to}`;
  document.getElementById('resultReverse').textContent =
    `↔ 1 ${to} = ${reverseRate.toFixed(6)} ${from}`;
  block.classList.add('has-result');

  // Add to history
  const entry = { ts: new Date().toISOString(), amount, from, result, to };
  history.unshift(entry);
  if (history.length > 30) history.pop();
  localStorage.setItem('cc_history', JSON.stringify(history));
  renderHistory();
}

function fmt(n) {
  return n >= 1000 ? n.toLocaleString('en-US', {maximumFractionDigits:2})
       : n < 0.01  ? n.toFixed(6)
       : n.toFixed(4);
}

function swapCurrencies() {
  const f = document.getElementById('fromCur');
  const t = document.getElementById('toCur');
  [f.value, t.value] = [t.value, f.value];
  convert(); updateFavBtn();
}

// ── Rates panel ───────────────────────────────────────────────────────────────
function renderRates() {
  const q = document.getElementById('rateSearch').value.toUpperCase();
  const base = document.getElementById('fromCur').value || 'USD';
  const grid = document.getElementById('ratesGrid');
  const filtered = Object.keys(rates).filter(c =>
    c.includes(q) || (NAMES[c]||'').toUpperCase().includes(q)
  ).sort();

  grid.innerHTML = filtered.map(c => {
    const val = (rates[c] / rates[base]).toFixed(4);
    return `<div class="rate-item" onclick="setTo('${c}')">
      <div class="rate-code">${c}</div>
      <div class="rate-val">${val}</div>
      <div class="rate-name">${NAMES[c]||''}</div>
    </div>`;
  }).join('');
}

function setTo(code) {
  document.getElementById('toCur').value = code;
  convert(); updateFavBtn();
}

// ── Favorites ─────────────────────────────────────────────────────────────────
function pairKey() {
  return `${document.getElementById('fromCur').value}/${document.getElementById('toCur').value}`;
}

function updateFavBtn() {
  const btn = document.getElementById('favBtn');
  const k = pairKey();
  btn.textContent = favorites.includes(k) ? '★' : '☆';
  btn.classList.toggle('starred', favorites.includes(k));
}

function toggleFav() {
  const k = pairKey();
  if (favorites.includes(k)) favorites = favorites.filter(x=>x!==k);
  else favorites.unshift(k);
  localStorage.setItem('cc_favs', JSON.stringify(favorites));
  updateFavBtn();
  renderFavs();
}

function renderFavs() {
  const el = document.getElementById('favList');
  if (!favorites.length) {
    el.innerHTML = '<div class="empty-msg">No favorites yet.<br>Star a currency pair above ☆</div>';
    return;
  }
  el.innerHTML = favorites.map(pair => {
    const [f,t] = pair.split('/');
    const rate = (rates[t]||1) / (rates[f]||1);
    return `<div class="fav-item">
      <div>
        <div class="fav-pair">${pair}</div>
        <div class="fav-rate">1 ${f} = ${rate.toFixed(6)} ${t}</div>
      </div>
      <button class="fav-del" onclick="removeFav('${pair}')" title="Remove">✕</button>
    </div>`;
  }).join('');
}

function removeFav(pair) {
  favorites = favorites.filter(x=>x!==pair);
  localStorage.setItem('cc_favs', JSON.stringify(favorites));
  updateFavBtn();
  renderFavs();
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) {
    el.innerHTML = '<div class="empty-msg">No conversions yet.</div>';
    return;
  }
  // Deduplicate rapid same-pair entries
  const shown = history.slice(0, 30);
  el.innerHTML = shown.map(h => {
    const t = new Date(h.ts);
    const time = `${t.toLocaleDateString()} ${t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
    return `<div class="history-item">
      <div>
        <div class="h-pair">${h.from} → ${h.to}</div>
        <div class="h-time">${time}</div>
      </div>
      <div class="h-amount">${fmt(h.amount)} ${h.from}</div>
      <div class="h-result">${fmt(h.result)} ${h.to}</div>
    </div>`;
  }).join('');
}

function clearHistory() {
  history = [];
  localStorage.removeItem('cc_history');
  renderHistory();
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

init();
</script>
</body>
</html>
